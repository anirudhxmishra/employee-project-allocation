
<aside class="sidebar">

  <div class="brand">
    <h2>Employee Portal</h2>
  </div>

  <nav class="navigation">

    <p class="menu-heading">MAIN MENU</p>

    @for (item of navigationItems; track item.route) {

    <a class="nav-item"
       [routerLink]="item.route"
       routerLinkActive="active"
       ariaCurrentWhenActive="page">

      @switch (item.icon) {
      @case ('dashboard') {
      <svg lucideHouse [size]="20"></svg>
      }
      @case ('employees') {
      <svg lucideUsers [size]="20"></svg>
      }
      @case ('skills') {
      <svg lucideGraduationCap [size]="20"></svg>
      }
      @case ('projects') {
      <svg lucideBriefcaseBusiness [size]="20"></svg>
      }
      @case ('resource-pool') {
      <svg lucideUserRoundSearch [size]="20"></svg>
      }
      @case ('candidates') {
      <svg lucideClipboardList [size]="20"></svg>
      }
      @case ('allocations') {
      <svg lucideCalendarCheck [size]="20"></svg>
      }
      }

      <span>{{ item.label }}</span>

    </a>

    }

  </nav>

</aside>
